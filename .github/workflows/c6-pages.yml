# GitHub Pages —— C6 PromptGate（根路径） + C7 传播控制台（/C7/）
#
# 为什么用 workflow 而不是「branch + /docs」：
#   GitHub Pages 的 legacy 模式只允许发布仓库根目录或 /docs，而本项目的应用在
#   C6_交付/app/ 与 C7_内容传播/app/ 下。所以用 build_type=workflow，把两个目录
#   组装成一个 artifact 发布。
#
# 为什么两个关卡共用一个 workflow：
#   一个仓库只有一个 Pages 站点；两个 workflow 各自 deploy 会互相覆盖（后跑的赢）。
#   所以这里统一组装：根路径 = C6，/C7/ = C7。
#
# 发布后地址：https://07meteorain.github.io/AI/  与  https://07meteorain.github.io/AI/C7/
name: Pages (C6 + C7)

on:
  push:
    branches: [master]
    paths:
      - "C6_交付/app/**"
      - "C7_内容传播/app/**"
      - ".github/workflows/c6-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy C6 + C7
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: C6 静态检查（防止把坏版本发上线）
        working-directory: C6_交付
        run: |
          node --test
          node tools/gen_rules_doc.js --check

      - name: C7 发布前自检（截图副本 / 正文 HTML / 数据指纹）
        working-directory: C7_内容传播
        run: python3 tools/pages_check.py

      - uses: actions/configure-pages@v5

      - name: 组装站点（根 = C6，/C7/ = C7）
        run: |
          mkdir -p _site/C7
          cp -r C6_交付/app/. _site/
          cp -r C7_内容传播/app/. _site/C7/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
