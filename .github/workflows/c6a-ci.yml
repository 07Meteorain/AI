# C6A · 交卷雷达 —— 数据与看板的一致性检查
#
# 这个工作流做四件事：
#   1) 检查看板不依赖任何外部资源（零 CDN、零接口、零埋点）；
#   2) 检查文档里的关键数字没有和 metrics.json 脱节；
#   3) 在所有支持的 Python 版本上编译数据管线（语法/兼容性）；
#   4) 跑 18 项单测（数据不变量 + 洞察数字自洽 + 真实快照结构）。
#
# 为什么**不**在这里重跑 build_dataset.py 做「逐字节对账」：
#   合成数据用了 random.gauss / betavariate，内部依赖 libm 的 log/cos，
#   Windows 与 Linux 的末位差异会让少数抽样翻转，产物有几行级微差。
#   「可复现」的精确边界写在 README 里：同平台同版本逐字节一致，
#   跨平台以提交的 data/raw/*.csv 为事实来源。CI 若强行比对，只会变成假红。
#
# 本项目坚持零依赖：加一个 pandas 就会让「clone 下来就能验证」失效。

name: C6A CI

on:
  push:
    branches: [master]
    paths:
      - "C6A_交付/**"
      - ".github/workflows/c6a-ci.yml"
  pull_request:
    paths:
      - "C6A_交付/**"
      - ".github/workflows/c6a-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: C6A_交付

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 版本信息
        run: python --version

      - name: 看板不依赖外部资源
        run: |
          if grep -rInE "(cdn\.|unpkg|jsdelivr|googleapis|fonts\.g|fetch\(|XMLHttpRequest)" app/ ; then
            echo "::error::看板里出现了外部依赖或网络请求"
            exit 1
          fi
          echo "零外部依赖 ✓"

      - name: 文档数字与指标快照对账
        run: |
          python - <<'PY'
          import json, pathlib, sys

          root = pathlib.Path(".")
          m = json.loads((root / "data/metrics.json").read_text(encoding="utf-8"))
          k = m["kpis"]
          readme = (root / "README.md").read_text(encoding="utf-8")

          must = [f"{k['rate']}%", f"{k['median']}", str(k["submitted"]), str(k["expected"])]
          missing = [v for v in must if v not in readme]
          if missing:
              print("README 缺少指标快照里的数字：", missing)
              sys.exit(1)

          stale = ["68.x", "TODO", "XXX"]
          for s in stale:
              for p in root.glob("**/*.md"):
                  if s in p.read_text(encoding="utf-8"):
                      print(f"{p} 仍含占位/旧数字 {s}")
                      sys.exit(1)

          print("文档数字对账通过")
          PY

      - name: 编译检查（语法与版本兼容）
        run: python -m compileall -q data tests tools

      - name: 单元测试
        run: python -m unittest discover -s tests -v
