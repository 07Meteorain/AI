# C6A · 交卷雷达 —— 数据管线与看板的一致性检查
#
# 这个工作流只做四件事：
#   1) 复跑数据管线，确认产物与仓库里提交的版本逐字节一致（防止「改了代码没重跑」）；
#   2) 跑单测（数据不变量 + 洞察数字自洽）；
#   3) 检查看板不依赖外部网络（零 CDN、零接口）；
#   4) 检查文档里的关键数字没有和 metrics.json 脱节。
#
# 之所以不装任何依赖：本项目坚持「clone 下来就能验证」，加一个 pandas
# 就会让「零依赖」这条性质失效。

name: C6A CI

on:
  push:
    branches: [master]
    paths:
      - "C6A_交付/**"
      - ".github/workflows/c6a-ci.yml"
  pull_request:
    paths:
      - "C6A_交付/**"
      - ".github/workflows/c6a-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: C6A_交付

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 版本信息
        run: python --version && git --version

      - name: 复跑数据管线
        run: python data/build_dataset.py

      - name: 产物应与提交一致（无漂移）
        run: |
          if ! git diff --quiet -- data/metrics.json data/clean app/js/data.js; then
            echo "::error::数据产物与代码不一致，请本地重跑 python data/build_dataset.py 后提交"
            git diff --stat -- data/metrics.json data/clean app/js/data.js
            exit 1
          fi
          echo "产物与提交一致"

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 看板不依赖外部资源
        run: |
          # 只允许 GitHub 链接出现在 HTML 的 <a href> 里；不允许 CDN / 字体 / 接口
          if grep -rInE "(cdn\.|unpkg|jsdelivr|googleapis|fonts\.g|fetch\(|XMLHttpRequest)" app/ ; then
            echo "::error::看板里出现了外部依赖或网络请求"
            exit 1
          fi
          echo "零外部依赖 ✓"

      - name: 文档数字与指标快照对账
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path(".")
          m = json.loads((root / "data/metrics.json").read_text(encoding="utf-8"))
          k = m["kpis"]
          need = {
              f"{k['rate']}%": "README.md",
              f"{k['median']}": "README.md",
          }
          readme = (root / "README.md").read_text(encoding="utf-8")
          missing = [v for v in need if v not in readme]
          if missing:
              print("README 缺少指标快照里的数字：", missing)
              sys.exit(1)
          # 文档里不允许出现上一版的旧数字
          stale = ["68.x", "1540", "1830"]
          for s in stale:
              for p in root.glob("**/*.md"):
                  if s in p.read_text(encoding="utf-8"):
                      print(f"{p} 仍含旧数字 {s}")
                      sys.exit(1)
          print("文档数字对账通过")
          PY
