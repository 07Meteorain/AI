# C4C 作业自动求解流水线 —— 默认配置
# 复制这个文件改成你自己的配置，或改用 config.json
# 优先级：默认值 < config.yaml < config.json < 环境变量 < 命令行参数

# ── 文档抬头信息 ──────────────────────────────
student: "Meteorain"
course: "Mathematics"
title: "Homework Solutions"
date_format: "%Y-%m-%d"

# ── 求解引擎 ──────────────────────────────────
solver:
  # 国产模型三选一：qwen（通义千问）| kimi（Moonshot）| deepseek
  # claude 仅用于 Level 4 的对照组实验
  provider: "qwen"
  model: null                 # null = 用 provider 的推荐模型
  temperature: 0.1# 数学题要低温度，抑制幻觉
  max_tokens: 2048
  timeout: 60
  use_llm: true# 无 API Key 时会自动降级到规则兜底
  verify: true                # 答案验证（强烈建议保持开启）

# ── 渲染偏好 ──────────────────────────────────
render:
  cjk: "auto"                 # auto | always | never
  show_verification: true     # 在 PDF 里显示 ✓已验证 / ⚠存疑 徽章
  figures: true               # matplotlib 自动作图

# ── 验证阈值（可按课程要求调紧/放宽）───────────
verify:
  substitution_tol: 1.0e-9    # 代回原式的残差上限
  cross_check_rel_tol: 1.0e-4 # 符号 vs 数值 的相对误差上限
  eigen_residual_tol: 1.0e-6  # det(A - λI) 残差上限
  ode_residual_tol: 1.0e-8    # ODE 代回残差上限