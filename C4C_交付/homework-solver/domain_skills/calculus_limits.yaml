  - priority: 10
    pattern:
      has_abstract_function: true
    maps_to: null
    solver: null  # → invoke oracle (LLM)
    reason: "Abstract function — requires reasoning, not computation"

# ============================================================
# VALIDATION RULES
# ============================================================

validation_rules:

  limit_computation:
    - type: form_check
      rule: "Result is a number, oo, -oo, zoo, nan, or 'DNE'"
    - type: type_check
      rule: "Result is sympy.Number or sympy.oo or sympy.zoo"

  epsilon_delta_notation:
    - type: form_check
      rule: "Result contains δ, uses inequality/absolute value/interval notation"
    - type: consistency_check
      rule: "All three representations (inequality, abs, interval) are equivalent"

  epsilon_delta_computation:
    - type: positivity_check
      rule: "δ > 0"
    - type: verification
      rule: "Substituting δ back: |x-a| < δ ⟹ |f(x)-L| < ε must hold"

  tangent_line:
    - type: form_check
      rule: "Result is y = mx + b form"
    - type: point_check
      rule: "Line passes through the given point"
    - type: slope_check
      rule: "Slope equals f'(x₀) at the given point"
